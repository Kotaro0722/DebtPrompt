version: "3"
services:
  app:
    build: .
    restart: always
    depends_on:
      - "db"
    volumes:
      - .:/bot
    environment:
      - PYTHONUNBUFFERED=1
  db:
    image: mariadb:11.3.2
    environment:
      MARIADB_DATABASE: debt
      MARIADB_ROOT_PASSWORD: pass
      TZ: Asia/Tokyo
    volumes:
      - ./volume:/var/lib/mysql
      - /home/kotaro/TaskManager/initdb.d:/docker-entrypoint-initdb.d:rw
